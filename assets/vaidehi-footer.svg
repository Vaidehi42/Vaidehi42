<svg xmlns="http://www.w3.org/2000/svg" width="850" viewBox="0 0 850 72" role="img" aria-label="Footer — Vaidehi Narvekar, built with intention">
  <defs>
    <linearGradient id="vnf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#C77B9B"/>
      <stop offset="0.75" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="60" y="34" width="730" height="1.6" rx="0.8" fill="url(#vnf-line)"/>
  <circle r="4" cy="34.8" fill="#E5B5C7">
    <animate attributeName="cx" values="80;770;80" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="58" fill="#E5B5C7" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">VAIDEHI NARVEKAR</text>
  <text x="790" y="58" fill="#80586B" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.5" text-anchor="end">create with intention</text>
</svg>
